app = "cap-door"
primary_region = "iad"

[env]
  PORT = "8088"

[[mounts]]
  source = "cap_data"
  destination = "/app/data"

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
